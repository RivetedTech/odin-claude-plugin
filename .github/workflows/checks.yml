name: Validate Odin skill
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n plugins/odin-api/skills/odin-api/scripts/odin
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build-skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: odin-api-skills
          path: dist/
